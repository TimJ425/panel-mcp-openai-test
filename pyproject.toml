[project]
name = "panel-mcp-openai-test"
version = "0.1.0"
description = "Experimental example wiring Jupyter + Panel + MCP + an OpenAI-compatible server together"
requires-python = ">=3.11"
dependencies = [
    # notebook / harness (the only libs the notebook needs)
    "panel>=1.5",
    "mcp>=1.9,<2",   # 2.x renamed FastMCP + changed APIs
    "openai>=1.60",
    # JupyterLab with /proxy/<port>/ URLs for the Panel app
    "jupyterlab>=4",
    "jupyter-server-proxy>=4",
    "ipykernel",
    # fake services
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.uv]
package = false
